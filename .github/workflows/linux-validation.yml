name: Linux validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate native ARM64 Debian
        run: |
          docker run --rm --platform linux/arm64 --volume "$GITHUB_WORKSPACE:/src" --workdir /src debian:13 bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git python3 scdoc gettext locales lintian systemd udev kmod dpkg-dev
            if command -v apt-get >/dev/null; then localedef -i en_US -f UTF-8 en_US.UTF-8; fi
            git config --global --add safe.directory /src
            make test
            make build
            lintian --fail-on error,warning dist/ydotool_*.deb
            apt-get install -y ./dist/ydotool_*.deb
            dpkg-query -W ydotool
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debian-arm64
          path: dist/
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            package: deb
          - image: ubuntu:24.04
            package: deb
          - image: fedora:43
            package: rpm
          - image: opensuse/leap:16.0
            package: rpm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build, run regression tests, and install package
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE: ${{ matrix.package }}
        run: |
          docker run --rm --env PACKAGE --volume "$GITHUB_WORKSPACE:/src" --workdir /src "$IMAGE" bash -euc '
            if command -v apt-get >/dev/null; then
              apt-get update
              if grep -q Ubuntu /etc/os-release; then compiler=gcc-14; else compiler=gcc; fi
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git python3 scdoc gettext locales lintian systemd udev kmod dpkg-dev "$compiler"
            elif command -v dnf >/dev/null; then
              dnf install -y gcc gcc-c++ cmake git make python3 gettext glibc-langpack-en libubsan scdoc systemd systemd-udev systemd-rpm-macros rpm-build redhat-rpm-config kmod
            else
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends -y gcc gcc-c++ cmake git-core make python3 gettext-tools glibc-locale libubsan1-gcc15 scdoc systemd systemd-rpm-macros rpm-build kmod udev
            fi
            if command -v apt-get >/dev/null; then localedef -i en_US -f UTF-8 en_US.UTF-8; fi
            git config --global --add safe.directory /src
            if command -v gcc-14 >/dev/null; then CC=gcc-14 make test; else make test; fi
            if [ "$PACKAGE" = deb ]; then
              if command -v gcc-14 >/dev/null; then CC=gcc-14 make build; else make build; fi
              apt-get install -y ./dist/ydotool_*.deb
              dpkg-query -W ydotool
              lintian --fail-on error,warning ./dist/ydotool_*.deb
            else
              bash packaging/build-rpm.sh
              if command -v dnf >/dev/null; then dnf install -y ./dist/ydotool-*.rpm; else zypper --non-interactive install --allow-unsigned-rpm -y ./dist/ydotool-*.rpm; fi
              rpm -q ydotool
            fi
            grep -q "User=ydotool" packaging/ydotoold.service
            grep -q "Group=ydotool" packaging/ydotoold.service
            grep -q "SupplementaryGroups=ydotool-uinput" packaging/ydotoold.service
            grep -q -- "--no-system-keys" packaging/ydotoold.service
            grep -q "socket-perm=0660" packaging/ydotoold.service
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ strategy.job-index }}
          path: dist/
          if-no-files-found: error
